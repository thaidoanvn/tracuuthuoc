$kind: http-request
description: |
  allFields matches the keyword in any drug field, including text that is
  not the name, active ingredient, or manufacturer.
url: "{{baseUrl}}/api/thuoc/search"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "keyword": "G6PD",
      "tenThuoc": false,
      "allFields": true,
      "hoatChat": false,
      "cssx": false
    }
order: 6000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("status is 200", function () {
        pm.response.to.have.status(200);
      });

      pm.test("all fields finds the contraindication text", function () {
        const rows = pm.response.json().result;
        pm.expect(rows).to.be.an("array").that.has.lengthOf(1);
        pm.expect(rows[0].code).to.eql("EFFE500");
      });

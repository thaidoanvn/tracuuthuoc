$kind: http-example
name: The body is missing, is not JSON, or omits keyword.
request:
  url: "{{baseUrl}}/api/thuoc/search"
  method: POST
  headers:
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "keyword": "para",
        "tenThuoc": true,
        "batDauVoi": false,
        "hoatChat": false,
        "cssx": false
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "message": "string"
      }
order: 2000

$kind: http-example
name: No drug has this id.
request:
  url: "{{baseUrl}}/api/thuoc/:id"
  method: GET
  headers:
    Accept: application/json
  pathVariables:
    - key: id
      value: "1"
      disabled: false
      description: "(Required) "
  body:
    type: text
    content: ""
response:
  statusCode: 404
  statusText: Not Found
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "message": "string"
      }
order: 3000

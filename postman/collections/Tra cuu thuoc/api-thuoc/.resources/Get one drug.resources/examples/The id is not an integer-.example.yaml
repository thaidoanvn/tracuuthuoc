$kind: http-example
name: The id is not an integer.
request:
  url: "{{baseUrl}}/api/thuoc/:id"
  method: GET
  headers:
    Accept: application/json
  pathVariables:
    - key: id
      value: "1"
      disabled: false
      description: "(Required) "
  body:
    type: text
    content: ""
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "message": "string"
      }
order: 2000

$kind: http-request
description: ""
url: "{{baseUrl}}/api/thuoc/:id"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: id
    value: "{{thuocId}}"
    disabled: false
    description: "(Required) "
settings: {}
examples: ./.resources/Get one drug.resources/examples
order: 2000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("status is 200", function () {
        pm.response.to.have.status(200);
      });

      pm.test("detail includes the clinical fields", function () {
        const body = pm.response.json();
        pm.expect(String(body.id)).to.eql(pm.collectionVariables.get("thuocId"));
        pm.expect(body.chiDinh).to.be.a("string").and.not.empty;
        pm.expect(body.soGiayPhep).to.be.a("string").and.not.empty;
        pm.expect(body.hamLuong).to.be.a("string");
        pm.expect(body.quyCach).to.be.a("string");
        pm.expect(body.lieuDung).to.be.a("string");
        pm.expect(body.dieuKienBhyt).to.be.a("string");
      });

spring:
  application:
    name: tracuuthuoc
  profiles:
    default: local
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update

server:
  port: 8088

app:
  api-key: ${API_KEY:thaidoan-tracuuthuoc-local}
  admin-username: ${ADMIN_USERNAME:admin}
  admin-password: ${ADMIN_PASSWORD:admin}
